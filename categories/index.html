<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Tool Categories — Laxman Nepal</title><meta name="description" content="Browse AI tools by category: coding, image, video, writing, research, productivity and more."><link rel="canonical" href="https://ai.laxmannepal.com.np/categories/"><meta property="og:title" content="AI Tool Categories — Laxman Nepal"><meta property="og:description" content="Browse the AI directory by category."><style>body{margin:0;font-family:-apple-system,BlinkMacSystemFont,Inter,system-ui,sans-serif;background:#f5f7fb;color:#101114}main{max-width:1100px;margin:auto;padding:28px 16px 60px}header,section{background:#ffffffc9;border:1px solid #fff;border-radius:24px;padding:24px;box-shadow:0 18px 55px #00000010;backdrop-filter:blur(22px)}h1{font-size:clamp(40px,7vw,72px);line-height:.95;letter-spacing:-.06em;margin:10px 0}p{color:#667085;line-height:1.6}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-top:18px}.card{display:block;padding:18px;border-radius:18px;background:#ffffffaa;border:1px solid #fff}.card strong{display:block}.card span{display:block;margin-top:6px;color:#667085;font-size:12px}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:450px){.grid{grid-template-columns:1fr}}</style></head><body><main><header><a href="../">← AI Tools</a><h1>AI tool categories.</h1><p>Browse crawlable category pages instead of relying only on JavaScript filters.</p></header><section><div id="grid">Loading categories…</div></section></main><script>fetch('../data/categories.json',{cache:'no-store'}).then(r=>r.json()).then(cs=>{document.getElementById('grid').className='grid';document.getElementById('grid').innerHTML=cs.map(c=>`<a class="card" href="${encodeURIComponent(c.slug)}/"><strong>${String(c.name).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))}</strong><span>${c.count} tools →</span></a>`).join('')}).catch(()=>document.getElementById('grid').textContent='Categories are temporarily unavailable.')<\/script></body></html>
