<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><meta name="description" content="GitHub AI tools and projects in the Laxman Nepal AI directory."><title>GitHub AI Tools | Laxman Nepal</title><style>:root{--bg:#f4f5f7;--text:#101114;--muted:#6b7280}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,Inter,system-ui,sans-serif;color:var(--text);background:radial-gradient(circle at 10% 0%,#11182718,transparent 30%),var(--bg)}a{text-decoration:none;color:inherit}.nav{position:sticky;top:0;z-index:10;padding:10px 14px;background:#f4f5f7d9;border-bottom:1px solid #fff;backdrop-filter:blur(28px)}.navin,.wrap{max-width:1200px;margin:auto}.navin{display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900}.back{padding:9px 12px;border:1px solid #fff;background:#fff9;border-radius:12px;font-weight:800}.wrap{padding:22px 15px 60px}.hero{padding:30px;border-radius:28px;background:#ffffffb5;border:1px solid #fff;backdrop-filter:blur(25px);box-shadow:0 20px 60px #0001}.hero h1{font-size:clamp(42px,7vw,72px);line-height:.9;letter-spacing:-.06em;margin:10px 0}.hero p{color:var(--muted);line-height:1.6}.search{width:100%;height:45px;border:1px solid #fff;background:#fff9;border-radius:14px;padding:0 14px;font:inherit;outline:0;margin-top:15px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin-top:18px}.card{padding:15px;border-radius:20px;background:#ffffffb5;border:1px solid #fff;backdrop-filter:blur(20px);transition:.2s}.card:hover{transform:translateY(-5px)}.logo{width:50px;height:50px;border-radius:15px;background:#fff;padding:9px;object-fit:contain}.name{font-weight:900;margin-top:12px}.meta{font-size:11px;color:var(--muted);margin-top:5px;line-height:1.4}.open{display:block;color:#2563eb;font-size:11px;font-weight:900;margin-top:12px}.empty{padding:40px;text-align:center;color:var(--muted);grid-column:1/-1}@media(max-width:900px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:650px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:430px){.grid{grid-template-columns:1fr}}</style></head><body><header class="nav"><div class="navin"><a class="brand" href="../">✦ AI Tools</a><a class="back" href="../">← Online AI Tools</a></div></header><main class="wrap"><section class="hero"><div>GitHub · Open Source</div><h1>GitHub AI Tools.</h1><p>Projects and AI tools sourced from GitHub live here. They are intentionally excluded from the main online AI catalog.</p><input id="q" class="search" placeholder="Search GitHub AI tools…"></section><div id="grid" class="grid"></div></main><script>const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const slug=s=>String(s).toLowerCase().normalize('NFKD').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');let tools=[];function render(){let q=document.getElementById('q').value.toLowerCase().trim();let list=tools.filter(t=>String(t.source||'').toLowerCase()==='github'||/github\.com/i.test(t.url||''));list=list.filter(t=>!q||`${t.title} ${t.description} ${t.category}`.toLowerCase().includes(q));document.getElementById('grid').innerHTML=list.map(t=>`<a class="card" href="../tools/${esc(t.slug||slug(t.title))}/"><img class="logo" src="${esc(t.logo||'../icon.svg')}" alt="${esc(t.title)} logo" onerror="this.src='../icon.svg'"><div class="name">${esc(t.title)}</div><div class="meta">${esc(t.category||'AI Tool')} · ${esc(t.pricing||'Check provider')}</div><div class="meta">${esc(t.description)}</div><span class="open">View project →</span></a>`).join('')||'<div class="empty">No GitHub AI tools found.</div>'}async function init(){try{tools=await(await fetch('../data/tools.json',{cache:'no-store'})).json();render()}catch(e){document.getElementById('grid').innerHTML='<div class="empty">GitHub catalog unavailable.</div>'}}document.getElementById('q').oninput=render;init();</script></body></html>
