<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><meta name="description" content="GitHub AI tools and projects in the Laxman Nepal AI directory."><link rel="canonical" href="https://ai.laxmannepal.com.np/github/"><title>GitHub AI Tools | Laxman Nepal</title><style>body{margin:0;font-family:-apple-system,BlinkMacSystemFont,Inter,system-ui,sans-serif;color:#101114;background:#f4f5f7}main{max-width:1200px;margin:auto;padding:22px 15px 60px}header,.card{background:#ffffffb5;border:1px solid #fff;border-radius:22px;padding:20px;backdrop-filter:blur(20px);box-shadow:0 20px 60px #00000010}.search{width:100%;padding:13px;border:1px solid #fff;border-radius:14px;background:#fff9;box-sizing:border-box;font:inherit;margin-top:15px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin-top:18px}.logo{width:50px;height:50px;border-radius:15px;background:#fff;padding:9px;object-fit:contain}.name{font-weight:900;margin-top:12px}.meta{font-size:11px;color:#6b7280;margin-top:5px;line-height:1.4}.open{display:block;color:#2563eb;font-size:11px;font-weight:900;margin-top:12px}.empty{padding:40px;text-align:center;color:#6b7280;grid-column:1/-1}@media(max-width:900px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:650px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:430px){.grid{grid-template-columns:1fr}}</style></head><body><main><header><a href="../">✦ AI Tools</a><h1>GitHub AI Tools.</h1><p>Open-source and GitHub-hosted projects identified in the canonical catalog.</p><input id="q" class="search" placeholder="Search GitHub AI tools…" aria-label="Search GitHub AI tools"></header><div id="grid" class="grid"></div></main><script>const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let tools=[];function render(){const q=document.getElementById('q').value.toLowerCase().trim();const list=tools.filter(t=>String(t.source||'').toLowerCase()==='github'||/github\.com/i.test(t.url||'')).filter(t=>!q||`${t.title} ${t.category}`.toLowerCase().includes(q));document.getElementById('grid').innerHTML=list.map(t=>`<a class="card" href="../tools/${encodeURIComponent(t.slug)}/"><img class="logo" src="${esc(t.logo||'../icon.svg')}" alt="${esc(t.title)} logo" loading="lazy" onerror="this.src='../icon.svg'"><div class="name">${esc(t.title)}</div><div class="meta">${esc(t.category||'AI Tool')} · ${esc(t.pricing||'Check provider')}</div><span class="open">View details →</span></a>`).join('')||'<div class="empty">No GitHub AI tools found.</div>'}fetch('../tools/index.json',{cache:'no-store'}).then(r=>r.json()).then(data=>{tools=data;render()}).catch(()=>document.getElementById('grid').innerHTML='<div class="empty">GitHub catalog unavailable.</div>');document.getElementById('q').oninput=render;</script></body></html>
