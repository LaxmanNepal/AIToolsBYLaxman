<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="Browse the complete researched AI tools catalog with pricing and dedicated detail pages."><title>All AI Tools — Laxman Nepal</title><style>:root{--bg:#f5f7fb;--text:#101114;--muted:#667085;--glass:#ffffffc4;--blue:#0a84ff}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,system-ui,sans-serif;background:radial-gradient(circle at 8% 0%,#0a84ff22,transparent 28%),radial-gradient(circle at 92% 8%,#8b5cf625,transparent 30%),var(--bg);color:var(--text)}a{text-decoration:none;color:inherit}.nav{position:sticky;top:0;z-index:5;padding:10px 14px;background:#f5f6f8dd;backdrop-filter:blur(28px);border-bottom:1px solid #fff}.navin{max-width:1180px;margin:auto;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:900}.back{padding:9px 12px;border-radius:12px;border:1px solid #fff;background:#ffffffa5;font-weight:800}.wrap{max-width:1180px;margin:auto;padding:22px 15px 60px}.hero{padding:30px;border:1px solid #fff;border-radius:28px;background:var(--glass);backdrop-filter:blur(30px);box-shadow:0 20px 60px #0000000d}.eyebrow{color:var(--blue);font-weight:900;font-size:11px;text-transform:uppercase;letter-spacing:.1em}.hero h1{font-size:clamp(40px,7vw,72px);line-height:.92;letter-spacing:-.06em;margin:10px 0}.hero p{color:var(--muted);max-width:720px;line-height:1.6}.search{display:flex;max-width:760px;padding:5px;border:1px solid #fff;border-radius:17px;background:#fff}.search input{flex:1;min-width:0;border:0;outline:0;padding:12px;background:transparent}.search button{border:0}.tools{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:16px}.card{position:relative;overflow:hidden;padding:15px;border:1px solid #fff;border-radius:22px;background:var(--glass);backdrop-filter:blur(25px);min-height:175px;display:flex;flex-direction:column;transition:.25s}.card:before{content:"";height:4px;position:absolute;left:0;right:0;top:0;background:var(--accent,#0a84ff)}.card:hover{transform:translateY(-5px);box-shadow:0 25px 60px #00000012}.logo{width:52px;height:52px;border-radius:15px;object-fit:contain;background:#fff;padding:8px}.rank{font-size:10px;color:#8b93a0;font-weight:900;margin-top:10px}.title{font-weight:900;margin-top:5px;line-height:1.2}.price{margin-top:auto;padding-top:10px;font-size:11px;font-weight:900;color:#475569}.status{font-size:10px;color:#0a84ff;margin-top:4px}@media(max-width:1000px){.tools{grid-template-columns:repeat(4,1fr)}}@media(max-width:760px){.tools{grid-template-columns:repeat(3,1fr)}}@media(max-width:520px){.tools{grid-template-columns:repeat(2,1fr);gap:9px}.card{padding:12px}.hero{padding:24px}.hero h1{font-size:44px}}</style></head><body><header class="nav"><div class="navin"><a class="brand" href="../">✦ AI Tools</a><a class="back" href="../">← Home</a></div></header><main class="wrap"><section class="hero"><div class="eyebrow">Laxman Nepal · researched catalog</div><h1>All AI Tools.</h1><p>Every catalogued tool is shown here. Open a card to view its dedicated AItools page with pricing, use cases, advantages, disadvantages and prompts.</p><form class="search" id="search"><input id="q" placeholder="Search tools…" aria-label="Search tools"><button class="back" type="submit">Search</button></form></section><section class="tools" id="tools"><div class="hero">Loading catalog…</div></section></main><script>const slug=s=>String(s).toLowerCase().normalize('NFKD').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');const esc=s=>String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));const color=cat=>{const c=String(cat||'').toLowerCase();if(c.includes('image'))return '#f43f5e';if(c.includes('video'))return '#8b5cf6';if(c.includes('writing'))return '#f59e0b';if(c.includes('coding'))return '#0ea5e9';if(c.includes('research'))return '#14b8a6';if(c.includes('productivity'))return '#22c55e';if(c.includes('automation'))return '#6366f1';return '#0a84ff'};let all=[];function render(){const q=document.getElementById('q').value.trim().toLowerCase();const list=all.filter(t=>`${t.title||''} ${t.category||''} ${t.description||''}`.toLowerCase().includes(q));document.getElementById('tools').innerHTML=list.map((t,i)=>{const s=slug(t.title);return `<a class="card" style="--accent:${color(t.category)}" href="../AItools/${s}/"><img class="logo" src="../AItools/${s}/${esc(t.logo||'logo-fallback.svg')}" alt="${esc(t.title)} logo" loading="lazy" onerror="this.src='../icon.svg'"><div class="rank">#${t.trendingRank||i+1} · ${esc(t.category||'AI')}</div><div class="title">${esc(t.title)}</div><div class="price">${esc(t.pricing||t.price||'Check provider')}</div><div class="status">View full details →</div></a>`}).join('')||'<div class="hero">No matching tools.</div>'}fetch('../AItools/index.json',{cache:'no-store'}).then(r=>r.json()).then(data=>{all=data;render()}).catch(()=>document.getElementById('tools').innerHTML='<div class="hero">Catalog is being generated. Refresh after the workflow finishes.</div>');document.getElementById('search').addEventListener('submit',e=>{e.preventDefault();render()});</script></body></html>
