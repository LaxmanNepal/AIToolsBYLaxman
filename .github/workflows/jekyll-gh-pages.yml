# Build and deploy the AI Tools directory to GitHub Pages
name: Deploy AI Tools

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Expand and classify AI catalog
        run: python3 Scripts/sync_catalog.py

      - name: Generate individual AI tool pages and SEO files
        run: python3 Scripts/generate_tool_pages.py

      - name: Generate tracked short redirects with UTM
        run: python3 Scripts/generate_redirects.py

      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Generate PWA PNG icons
        run: |
          convert -background none icon.svg -resize 192x192 icon-192.png
          convert -background none icon.svg -resize 512x512 icon-512.png
          test -s icon-192.png
          test -s icon-512.png

      - name: Validate generated site
        run: |
          test -s sitemap.xml
          test -s robots.txt
          test -s icon-192.png
          test -s icon-512.png
          python3 - <<'PY'
          import json
          from pathlib import Path
          tools=json.loads(Path('data/tools.json').read_text(encoding='utf-8'))
          if len(tools)<5000: raise SystemExit(f'Expected 5000+ tools, found {len(tools)}')
          unlimited=sum(t.get('category')=='Unlimited Free AI Tools' for t in tools)
          if unlimited<100: raise SystemExit(f'Expected 100+ unlimited-free tools, found {unlimited}')
          missing=[]; redirects=[]
          for t in tools:
              title=t.get('title') or t.get('name') or 'ai-tool'
              slug=''.join(c.lower() if c.isalnum() else '-' for c in title).strip('-')
              while '--' in slug: slug=slug.replace('--','-')
              if not (Path('tools')/slug/'index.html').is_file(): missing.append(title)
              if not (Path('go')/slug/'index.html').is_file(): redirects.append(title)
          if missing: raise SystemExit('Missing generated pages: '+', '.join(missing[:20]))
          if redirects: raise SystemExit('Missing redirects: '+', '.join(redirects[:20]))
          print(f'Validated {len(tools)} AI tools and {unlimited} unlimited-free tools.')
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload static site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
