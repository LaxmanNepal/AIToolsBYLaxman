name: Build and Deploy AI Tools

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'icon.svg'
      - 'manifest.json'
      - 'sw.js'
      - 'github/**'
      - 'trending/**'
      - 'data/tools.json'
      - 'scripts/**'
      - 'categories/index.html'
      - 'compare/**'
      - 'search/**'
      - '.github/workflows/refresh-ai-tools.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build canonical catalog
        run: python scripts/build.py
      - name: Validate generated site
        run: python scripts/validate.py
      - name: Check provider URLs
        run: python scripts/check_links.py
      - name: Prepare public artifact
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html icon.svg manifest.json sw.js sitemap.xml robots.txt _site/
          cp -r tools go categories github trending compare search _site/
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
