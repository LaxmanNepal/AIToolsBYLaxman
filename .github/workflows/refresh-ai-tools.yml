name: Refresh AI Tools Catalog

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'
  push:
    paths:
      - 'scripts/generate_tools.py'
      - 'scripts/tool_page.html'
      - '.github/workflows/refresh-ai-tools.yml'

permissions:
  contents: write

jobs:
  build-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install parser
        run: python -m pip install --disable-pip-version-check beautifulsoup4

      - name: Generate 500+ tools and detail pages
        run: python scripts/generate_tools.py

      - name: Commit generated catalog
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/tools.json tools
          if git diff --cached --quiet; then
            echo 'No catalog changes.'
          else
            git commit -m 'chore: refresh 500+ AI tools catalog'
            git push
          fi
