name: Refresh AI Tools Catalog

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'
  push:
    paths:
      - 'scripts/generate_tools.py'
      - 'scripts/build_aitools.py'
      - 'scripts/tool_page.html'
      - '.github/workflows/refresh-ai-tools.yml'

permissions:
  contents: write

jobs:
  build-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser
        run: python -m pip install --disable-pip-version-check beautifulsoup4
      - name: Research and generate 500+ AI tools
        run: python scripts/build_aitools.py
      - name: Validate catalog
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('data/tools.json')
          tools = json.loads(p.read_text(encoding='utf-8'))
          assert len(tools) >= 500, f'Expected 500+ tools, found {len(tools)}'
          urls = [str(x.get('url','')).rstrip('/').lower() for x in tools]
          assert all(urls), 'Every tool must have a URL'
          assert len(urls) == len(set(urls)), 'Duplicate tool URLs detected'
          names = [str(x.get('title','')).strip().lower() for x in tools]
          assert all(names), 'Every tool must have a title'
          assert len(names) == len(set(names)), 'Duplicate tool titles detected'
          print(f'Validated {len(tools)} unique AI tools')
          PY
      - name: Commit catalog, pages and local logos
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/tools.json tools aitools
          if git diff --cached --quiet; then
            echo 'No catalog changes.'
          else
            git commit -m 'chore: refresh researched AI tools catalog and logos'
            git push
          fi
