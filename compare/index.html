<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Compare AI Tools — Laxman Nepal</title><meta name="description" content="Compare selected AI tools side by side."><link rel="canonical" href="https://ai.laxmannepal.com.np/compare/"><style>body{margin:0;font-family:-apple-system,BlinkMacSystemFont,Inter,system-ui,sans-serif;background:#f5f7fb;color:#101114}main{max-width:1100px;margin:auto;padding:28px 16px 60px}header,.card{background:#ffffffc9;border:1px solid #fff;border-radius:24px;padding:22px;box-shadow:0 18px 55px #00000010;backdrop-filter:blur(22px)}h1{font-size:clamp(38px,7vw,68px);line-height:.95;letter-spacing:-.06em;margin:10px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}.muted{color:#667085;line-height:1.6}.open{display:inline-block;margin-top:15px;padding:11px 13px;background:#111827;color:#fff;border-radius:12px;font-weight:900;text-decoration:none}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><main><header><a href="../">← AI Tools</a><h1>Compare AI tools.</h1><p class="muted">Side-by-side comparison is generated from the canonical catalog. For full benefits, limitations and prompts, open each tool page.</p></header><section id="grid" class="grid"><div class="card">Loading…</div></section></main><script>const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const ids=new Set((new URLSearchParams(location.search).get('tools')||'').split(',').filter(Boolean).slice(0,3));fetch('../tools/index.json',{cache:'no-store'}).then(r=>r.json()).then(ts=>{const selected=ts.filter(t=>ids.has(t.slug));document.getElementById('grid').innerHTML=selected.length?selected.map(t=>`<article class="card"><h2>${esc(t.title)}</h2><p class="muted"><b>Category:</b> ${esc(t.category)}<br><b>Pricing:</b> ${esc(t.pricing)}</p><a class="open" href="../tools/${encodeURIComponent(t.slug)}/">Open details →</a></article>`).join(''):'<article class="card"><strong>Select up to 3 tools from the homepage.</strong><p class="muted">Use the Compare button on tool cards.</p></article>'}).catch(()=>document.getElementById('grid').textContent='Comparison data unavailable.');</script></body></html>
